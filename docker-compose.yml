services:
  postgres:
    image: postgres:18-alpine
    container_name: stokrova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stokrova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stokrova_dev_password}
      POSTGRES_DB: ${DB_NAME:-stokrova_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stokrova} -d ${DB_NAME:-stokrova_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stokrova-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stokrova-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-stokrova_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-stokrova_minio_secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: stokrova-mailhog
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:

