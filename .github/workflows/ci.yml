name: STOKROVA Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Monorepo Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Typecheck Across All Workspaces
        run: pnpm -r run typecheck

      - name: Monorepo Build Gate
        run: pnpm -r run build

      - name: Run Automated Test Suites (>1,515 Tests)
        run: pnpm -r run test

      - name: Run Apex Global Full Business Day Simulation
        run: pnpm exec vitest run scripts/simulate-business-day.spec.ts

  container-build:
    name: Container Image Build & Security Validation
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: stokrova/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin-web/Dockerfile
          push: false
          tags: stokrova/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
