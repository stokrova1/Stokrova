apiVersion: v1
kind: ConfigMap
metadata:
  name: stokrova-config
  namespace: stokrova
  labels:
    app.kubernetes.io/part-of: stokrova
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  DB_PORT: "5432"
  DB_NAME: "stokrova_prod"
  REDIS_PORT: "6379"
  S3_ENDPOINT: "http://stokrova-minio.stokrova.svc.cluster.local:9000"
  S3_BUCKET_NAME: "stokrova-assets"
  CORS_ALLOWED_ORIGINS: "https://admin.stokrova.com,https://pos.stokrova.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: stokrova-secrets
  namespace: stokrova
  labels:
    app.kubernetes.io/part-of: stokrova
type: Opaque
stringData:
  DB_USER: "stokrova_admin"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION_VAULT"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_AUTH_SECRET"
  JWT_SECRET: "CHANGE_ME_ED25519_OR_HS256_STRONG_SECRET"
  S3_ACCESS_KEY: "CHANGE_ME_S3_ACCESS_KEY"
  S3_SECRET_KEY: "CHANGE_ME_S3_SECRET_KEY"
  WEBHOOK_HMAC_SECRET: "CHANGE_ME_WEBHOOK_SIGNING_SECRET"
