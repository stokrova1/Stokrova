apiVersion: apps/v1
kind: Deployment
metadata:
  name: stokrova-admin-web
  namespace: stokrova
  labels:
    app.kubernetes.io/name: stokrova-admin-web
    app.kubernetes.io/part-of: stokrova
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stokrova-admin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stokrova-admin-web
    spec:
      containers:
        - name: admin-web
          image: stokrova/admin-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stokrova-admin-svc
  namespace: stokrova
  labels:
    app.kubernetes.io/name: stokrova-admin-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: stokrova-admin-web
