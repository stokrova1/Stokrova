# Render Blueprint for the Stokrova engine (apps/api).
# Render reads this file when you choose "New > Blueprint" and pick this repository.
# Secret values are marked sync:false, so Render asks for them in its form and they never live in git.
services:
  - type: web
    name: stokrova-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Nigeria
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@stokrova/api..." run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Supabase database (use the "Session pooler" connection string from Supabase)
      - key: DATABASE_URL
        sync: false
      - key: DURABLE_HYDRATE
        value: "true"
      # Supabase sign-in checks
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      # Your Vercel address(es), comma separated, e.g. https://stokrova.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      # Optional: subscription payments (leave empty to hide the buttons)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      # Optional: daily summary delivery
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTS_FROM_EMAIL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
